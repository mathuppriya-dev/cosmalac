version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: cosmalac-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cosmalac-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/cosmalac
      - JWT_SECRET=cosmalac_super_secret_key_2026!
      - JWT_REFRESH_SECRET=cosmalac_refresh_secret_key_2026!
      - NODE_ENV=production
    depends_on:
      - mongodb
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cosmalac-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  mongo-data:
